# Every morning: pick programming for today and the next two days, commit the
# schedules, and publish web/ to GitHub Pages. No admin needed.
# Pushing changes under web/ (e.g. a hand-picked day) just redeploys.
#
# One-time setup: push this repo to GitHub, then Settings → Pages → Source:
# "GitHub Actions". Run it once by hand from the Actions tab to go live.
name: Daily programming

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 4–5 AM US Eastern
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to program, starting today'
        default: '3'
      extra:
        description: 'Extra autopilot options (e.g. --channels 10 --rights any)'
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-programming
  cancel-in-progress: false

jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      STATION_TIMEZONE: America/New_York
      YEAR_FROM: '1960'
      YEAR_TO: '1999'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick programming
        if: github.event_name != 'push'
        working-directory: admin
        run: node autopilot.js --days "${{ inputs.days || '3' }}" ${{ inputs.extra }}

      - name: Commit schedules
        if: github.event_name != 'push'
        run: |
          git config user.name "this-day-tv-bot"
          git config user.email "this-day-tv-bot@users.noreply.github.com"
          git add web/schedules web/station.json
          git diff --cached --quiet || git commit -m "Programming for $(TZ=$STATION_TIMEZONE date +%B\ %-d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
